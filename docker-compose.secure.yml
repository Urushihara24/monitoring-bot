services:
  monitoring-bot:
    build:
      context: .
      target: runtime-nonroot
    container_name: monitoring-pricing-bot
    restart: unless-stopped
    init: true
    stop_grace_period: 20s

    volumes:
      - bot-data:/app/data
      - bot-logs:/app/logs
      - ./.env:/app/.env:ro
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
    networks:
      - monitoring-net

volumes:
  bot-data:
  bot-logs:

networks:
  monitoring-net:
    driver: bridge
