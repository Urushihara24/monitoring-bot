services:
  monitoring-bot:
    build:
      context: .
      target: runtime
    container_name: monitoring-pricing-bot
    restart: unless-stopped
    init: true
    stop_grace_period: 20s

    volumes:
      # Backward-compatible host bind mounts. Existing deployments keep their
      # current ownership model; use docker-compose.secure.yml for non-root.
      - ./data:/app/data
      - ./logs:/app/logs
      # Needed for live-sync cookies/settings from .env without rebuilding.
      - ./.env:/app/.env:ro
    env_file:
      - .env
    environment:
      - TZ=Europe/Moscow
    networks:
      - monitoring-net

networks:
  monitoring-net:
    driver: bridge
