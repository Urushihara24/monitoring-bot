name: Security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies and pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit
      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt

  secret-patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reject obvious credential material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(TELEGRAM_BOT_TOKEN|GGSEL_(API_KEY|API_SECRET|ACCESS_TOKEN)|DIGISELLER_(API_KEY|API_SECRET|ACCESS_TOKEN))=[^[:space:]]+' -- ':!*.example' ':!tests/**'; then
            echo 'Potential credential assignment found in tracked files.' >&2
            exit 1
          fi
